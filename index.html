<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeeEndVN</title>
  <meta name="description" content="Personal homepage of TeeEndVN, mobile developer and maker of Mojimo.">
  <link rel="icon" type="image/png" href="assets/mojimo-icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --text: #1b1b1f;
      --muted: #5f6068;
      --border: #e6e5e0;
      --accent: #2f7fe6;
      --accent-soft: #e6f0fd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --surface: #1b1b1f;
        --text: #ececee;
        --muted: #a0a1a8;
        --border: #2c2c32;
        --accent: #5b9df0;
        --accent-soft: #15213a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 20px 48px;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: block;
    }
    h1 {
      font-size: 2.25rem;
      line-height: 1.2;
      margin: 24px 0 8px;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.125rem;
      margin: 0 0 28px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 56px;
    }
    .links a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 16px;
    }
    section { margin-bottom: 48px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .app-icon {
      flex: none;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: block;
    }
    .play { display: inline-block; margin: 4px 0 0 -10px; }
    .play img { height: 58px; display: block; }
    .card h3 { margin: 0 0 4px; font-size: 1.15rem; }
    .card h3 a { color: var(--text); text-decoration: none; }
    .card h3 a:hover { color: var(--accent); }
    .app-link { flex: none; display: block; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
    .more { color: var(--accent); font-weight: 500; text-decoration: none; }
    .more:hover { text-decoration: underline; }
    .card p { margin: 0 0 12px; color: var(--muted); }
    footer {
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    @media (max-width: 480px) {
      main { padding-top: 48px; }
      h1 { font-size: 1.85rem; }
      .card { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="https://github.com/TeeEndVN.png" alt="TeeEndVN avatar">
    <h1>Hi, I'm TeeEndVN</h1>
    <p class="tagline">Mobile developer and maker of Mojimo.</p>

    <nav class="links">
      <a href="https://github.com/TeeEndVN">GitHub</a>
      <a href="https://mojimo.teeendvn.com/">Mojimo</a>
    </nav>

    <section>
      <h2>Projects</h2>
      <div class="card">
        <a class="app-link" href="https://mojimo.teeendvn.com/"><img class="app-icon" src="assets/mojimo-icon.png" alt="Mojimo app icon" width="72" height="72"></a>
        <div>
          <h3><a href="https://mojimo.teeendvn.com/">Mojimo</a></h3>
          <p>Read Japanese anywhere. Scan text in any app, game or photo to see readings and meanings right away, save new words to your library, and learn the kanji behind them.</p>
          <div class="actions">
          <a class="play" href="https://play.google.com/store/apps/details?id=com.teeendvn.mojimo.prod" target="_blank" rel="noopener">
            <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
          </a>
          <a class="more" href="https://mojimo.teeendvn.com/">Learn more →</a>
          </div>
        </div>
      </div>
    </section>

    <footer>© 2026 TeeEndVN</footer>
  </main>
</body>
</html>
