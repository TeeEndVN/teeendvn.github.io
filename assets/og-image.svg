<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#5b9df0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5b9df0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatar-clip">
      <circle cx="315" cy="315" r="170"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="315" cy="315" r="178" fill="none" stroke="#5b9df0" stroke-opacity="0.55" stroke-width="4"/>
  <image href="avatar.jpg" xlink:href="avatar.jpg" x="145" y="145" width="340" height="340" clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice"/>
  <text x="560" y="300" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="96" font-weight="700" fill="#ececee" letter-spacing="-2">TeeEndVN</text>
  <text x="564" y="372" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500" fill="#a0a1a8">Mobile developer,</text>
  <text x="564" y="422" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500" fill="#a0a1a8">maker of <tspan fill="#5b9df0">Mojimo</tspan></text>
</svg>
