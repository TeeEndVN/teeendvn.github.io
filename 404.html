<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - TeeEndVN</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/avatar-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf8;
      --surface: #ffffff;
      --text: #1b1b1f;
      --muted: #5f6068;
      --border: #e6e5e0;
      --accent: #2f7fe6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --surface: #1b1b1f;
        --text: #ececee;
        --muted: #a0a1a8;
        --border: #2c2c32;
        --accent: #5b9df0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 72px 20px 48px;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: block;
    }
    h1 {
      font-size: 2.25rem;
      line-height: 1.2;
      margin: 24px 0 8px;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.125rem;
      margin: 0 0 28px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 56px;
    }
    .links a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    footer {
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    footer a { color: inherit; text-decoration: none; }
    @media (max-width: 480px) {
      main { padding-top: 48px; }
      h1 { font-size: 1.85rem; }
    }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="/assets/avatar.jpg" alt="" width="88" height="88">
    <h1>Page not found</h1>
    <p class="tagline">The page you're looking for doesn't exist or has moved.</p>

    <nav class="links">
      <a href="/">Home</a>
      <a href="https://mojimo.teeendvn.com/">Mojimo</a>
    </nav>

    <footer>© 2026 <a href="/">TeeEndVN</a></footer>
  </main>
</body>
</html>
